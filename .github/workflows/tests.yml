
name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

  
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: Python ${{ matrix.python-version }}

    env:
      MPLBACKEND: Agg

    steps:

      - name: Check out the repository
        uses: actions/checkout@v4

      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip


      - name: Install ThermoSim and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify the package imports
        run: |
          python -c "import ThermoSim; print('ThermoSim', ThermoSim.__version__)"
          python -c "import CoolProp; print('CoolProp ', CoolProp.__version__)"

      - name: Run the test suite
        run: pytest tests/ -q

      - name: Check bundled package data
        run: |
          python -c "
          from ThermoSim import config
          from ThermoSim.state import Prop
          config.set_dead_state(298.15, 101325)
          h = Prop('T66', 'x', P=1e5, T=400).H
          assert abs(h - 221493.4) < 1.0, f'T66 enthalpy wrong: {h}'
          print('T66 package data OK:', round(h, 1), 'J/kg')
          "
      - name: Run validation against published examples
        if: matrix.python-version == '3.12'
        run: |
          cd validation
          python validate_moran.py
          python validate_moran_86.py
          python validate_moran_gas.py
          python validate_moran_refrig.py
