
name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04

  
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: Python ${{ matrix.python-version }}

    env:
      MPLBACKEND: Agg

    steps:

      - name: Check out the repository
        uses: actions/checkout@v4

      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip


      - name: Install ThermoSim and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify the package imports
        run: |
          python -c "import ThermoSim; print('ThermoSim', ThermoSim.__version__)"
          python -c "import CoolProp; print('CoolProp ', CoolProp.__version__)"

      - name: Run the test suite
        run: pytest tests/ -q

      - name: Check the Therminol 66 alias
        run: |
          python -c "
          import CoolProp.CoolProp as CP
          from ThermoSim import config
          from ThermoSim.state import Prop
          config.set_dead_state(298.15, 101325)
          h = Prop('T66', 'x', P=1e5, T=400).H
          h_cp = CP.PropsSI('H', 'T', 400, 'P', 1e5, 'INCOMP::T66')
          assert abs(h - h_cp) < 1e-6, f'T66 alias wrong: {h} vs {h_cp}'
          print('T66 -> INCOMP::T66 OK:', round(h, 1), 'J/kg')
          "
      - name: Run validation against published examples
        if: matrix.python-version == '3.12'
        run: |
          cd validation
          python validate_moran.py
          python validate_moran_86.py
          python validate_moran_gas.py
          python validate_moran_refrig.py
